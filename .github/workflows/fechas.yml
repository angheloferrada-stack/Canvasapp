# Guardar este archivo en la ruta: .github/workflows/fechas.yml
name: Fechas Canvas

on:
  schedule:
    # Corre todos los días a las 11:00 UTC (08:00 en Chile en verano, 07:00 en invierno)
    - cron: "0 11 * * *"
  workflow_dispatch:  # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escanear Canvas y Gmail, generar calendario
        env:
          CANVAS_URL: ${{ secrets.CANVAS_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python fechas.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "fechas-bot"
          git config user.email "fechas-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || (git commit -m "Actualizar fechas" && git push)
